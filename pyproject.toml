[project]
name = "hanoi-towers"
version = "0.1.0"
description = "Tower of Hanoi game with hints and an auto-solver that works from any position. Playable in the browser."
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]  # the original script stays exactly as it was written

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]  # lets tests do `from hanoi.logic import rules`
# Tests run without a screen (dummy video driver), so pygame can't use the GPU renderer.
filterwarnings = ["ignore:no fast renderer available"]
